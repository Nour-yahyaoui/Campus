name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  node:
    name: Node · typecheck, tests, builds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: campussphere_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/campussphere_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/campussphere_test
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      ALLOW_DEV_SIGN_IN: "true"
      RATE_LIMIT_DISABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck every workspace
        run: npm run typecheck
      - name: Apply migrations to the test database
        run: npm run db:migrate
      - name: Integration tests (real PostgreSQL)
        run: npm run db:verify && npm test
      - name: Production builds
        run: |
          npm run build --workspace @campussphere/web
          npm run build --workspace @campussphere/api

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  rust:
    name: Rust · fmt, clippy, tests, release build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # apps/rust-api is its own Cargo workspace so that a container builder
      # pointed at that folder (which is Render's default context) can compile
      # it without reaching above it.
      - name: Formatting
        working-directory: apps/rust-api
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        working-directory: apps/rust-api
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Unit tests
        working-directory: apps/rust-api
        run: cargo test --workspace --locked
      - name: Release build
        working-directory: apps/rust-api
        run: cargo build --release --locked -p campussphere-api

  rust-image:
    name: Rust · container image builds
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # This mirrors the Render service exactly: the context is apps/rust-api,
      # not the repository root. If it builds here, it builds there.
      - name: docker build
        run: docker build -f apps/rust-api/Dockerfile -t campussphere-rust-api:ci apps/rust-api

  openapi:
    name: OpenAPI contract syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate YAML parses
        run: |
          npx --yes yaml-lint openapi/openapi.yaml 2>/dev/null \
            || node -e "const fs=require('fs');const t=fs.readFileSync('openapi/openapi.yaml','utf8');if(!t.includes('openapi: 3.1.0'))process.exit(1);console.log('openapi file present');"
