name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  node:
    name: Node · typecheck, tests, builds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: campussphere_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/campussphere_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/campussphere_test
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      ALLOW_DEV_SIGN_IN: "true"
      RATE_LIMIT_DISABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck every workspace
        run: npm run typecheck
      - name: Apply migrations to the test database
        run: npm run db:migrate
      - name: Integration tests (real PostgreSQL)
        run: npm run db:verify && npm test
      - name: Production builds
        run: |
          npm run build --workspace @campussphere/web
          npm run build --workspace @campussphere/api

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  rust:
    name: Rust · fmt, clippy, tests, release build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # apps/rust-api is its own Cargo workspace so that a container builder
      # pointed at that folder (which is Render's default context) can compile
      # it without reaching above it.
      - name: Formatting
        working-directory: apps/rust-api
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        working-directory: apps/rust-api
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Unit tests
        working-directory: apps/rust-api
        run: cargo test --workspace --locked
      - name: Release build
        working-directory: apps/rust-api
        run: cargo build --release --locked -p campussphere-api

  rust-runtime:
    name: Rust · boots and serves against PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: campussphere
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply the schema
        run: |
          for file in migrations/*.sql; do
            echo "applying $file"
            psql "postgresql://postgres:postgres@127.0.0.1:5432/campussphere" \
              -v ON_ERROR_STOP=1 -q -f "$file"
          done
      - name: Build
        working-directory: apps/rust-api
        run: cargo build --locked -p campussphere-api
      # Compiling is not the same as working. This starts the real binary
      # against a real database and fails on a non-2xx, which is exactly the
      # class of bug (pool after_connect) that reached Render once.
      - name: Boot and probe
        working-directory: apps/rust-api
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/campussphere
          PORT: "8099"
          RUST_LOG: info
        run: |
          ./target/debug/campussphere-api > /tmp/api.log 2>&1 &
          status=0
          # Print every response rather than aborting on the first one, so a
          # failure says which endpoint broke and what it returned.
          for path in /health/live /health/ready /api/v1/clubs /api/v1/events /api/v1/projects "/api/v1/search?q=robotics"; do
            code=$(curl -sS -o /tmp/body.json -w "%{http_code}" "http://127.0.0.1:8099$path" || true)
            echo "--- $path -> $code"
            head -c 300 /tmp/body.json; echo
            case "$code" in
              2*) ;;
              *) status=1; echo "::error title=$path returned $code::$(head -c 400 /tmp/body.json | tr '\n' ' ')" ;;
            esac
          done
          if [ "$status" -ne 0 ]; then
            echo "=== API log ==="; tail -60 /tmp/api.log
            # Annotations are readable through the checks API, which is the only
            # log channel available to some tooling.
            echo "::error title=API log::$(tail -6 /tmp/api.log | tr '\n' ' ' | cut -c1-600)"
          fi
          kill %1 2>/dev/null || true
          exit "$status"

  rust-image:
    name: Rust · container image builds
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # This mirrors the Render service exactly: the context is apps/rust-api,
      # not the repository root. If it builds here, it builds there.
      - name: docker build
        run: docker build -f apps/rust-api/Dockerfile -t campussphere-rust-api:ci apps/rust-api

  openapi:
    name: OpenAPI contract syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate YAML parses
        run: |
          npx --yes yaml-lint openapi/openapi.yaml 2>/dev/null \
            || node -e "const fs=require('fs');const t=fs.readFileSync('openapi/openapi.yaml','utf8');if(!t.includes('openapi: 3.1.0'))process.exit(1);console.log('openapi file present');"
