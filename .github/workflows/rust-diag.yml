# Temporary: this sandbox has no Rust toolchain and cannot reach crates.io, so
# the GitHub runner is the only place the Rust workspace can be compiled. This
# workflow captures fmt/clippy/build output into a file on the branch, which is
# the only channel back. Delete it once the Rust API is green in CI.
name: Rust diagnostics

on:
  workflow_dispatch:
  push:
    branches: ["arena/d7dcb538-campus"]

permissions:
  contents: write

jobs:
  diag:
    # The run itself commits its report; that commit must not start another run.
    if: ${{ !contains(github.event.head_commit.message || '', '[skip ci]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Collect
        run: |
          set +e
          out="$RUNNER_TEMP/diag.md"
          echo "# Rust diagnostics" > "$out"

          echo "## cargo generate-lockfile" >> "$out"
          cargo generate-lockfile > "$RUNNER_TEMP/lock.txt" 2>&1
          echo "\`exit=$?\`" >> "$out"

          echo "## cargo fmt --all (applied)" >> "$out"
          cargo fmt --all > "$RUNNER_TEMP/fmt.txt" 2>&1
          echo "\`exit=$?\`" >> "$out"

          echo "## cargo build -p campussphere-api --message-format short" >> "$out"
          cargo build -p campussphere-api --message-format short > "$RUNNER_TEMP/build.txt" 2>&1
          echo "\`exit=$?\`" >> "$out"
          echo '```' >> "$out"
          grep -E "error|warning: unused" "$RUNNER_TEMP/build.txt" | head -120 >> "$out"
          echo '```' >> "$out"

          echo "## cargo clippy --message-format short" >> "$out"
          cargo clippy --workspace --all-targets --all-features --message-format short -- -D warnings > "$RUNNER_TEMP/clippy.txt" 2>&1
          echo "\`exit=$?\`" >> "$out"
          echo '```' >> "$out"
          grep -E "^[a-z/:._-]+\.rs:[0-9]+" "$RUNNER_TEMP/clippy.txt" | head -80 >> "$out"
          echo '```' >> "$out"

          echo "## cargo test" >> "$out"
          cargo test --workspace > "$RUNNER_TEMP/test.txt" 2>&1
          echo "\`exit=$?\`" >> "$out"
          echo '```' >> "$out"
          grep -E "test result|^error|FAILED|panicked" "$RUNNER_TEMP/test.txt" | head -40 >> "$out"
          echo '```' >> "$out"

          cp "$out" rust-diag.md

      - name: Publish
        if: always()
        run: |
          git config user.name "rust-diagnostics"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Rust diagnostics [skip ci]"
          git push
