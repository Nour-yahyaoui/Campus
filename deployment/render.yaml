# One-service deployment (the easy path).
#
# Render reads this file when you choose "New → Blueprint". It creates a single
# web service — the whole product, front end and API — and nothing else. The
# database is your existing Neon one, and its schema is created by opening
# `/api/initialize` once after the first deploy.
#
# Before applying:
#   1. Replace nothing in this file.
#   2. After the service exists, fill the three `sync: false` secrets:
#        DATABASE_URL          Neon *pooled* connection string (?sslmode=require)
#        GOOGLE_CLIENT_ID      from Google Cloud Console
#        GOOGLE_CLIENT_SECRET  from Google Cloud Console
#
# First-run setup — set at least one of these, or /api/initialize refuses to
# write once the service is in production:
#   INITIAL_ADMIN_EMAIL     recommended: the first verified Google sign-in with
#                           this address becomes the first super-admin
#   SETUP_TOKEN             lets /api/initialize create that account with a
#                           ?token=… (writes are POST only)
#
# Other optional variables (add them in the dashboard when you need them):
#   NEXT_PUBLIC_SITE_URL    only for a custom domain (otherwise the Render URL is used)
#   AWS_* + STORAGE_BUCKET  enables image uploads (see docs/DEPLOY_STEPS.md Step 4b)
#   EMAIL_* / RESEND_API_KEY / SMTP_URL   real email delivery
#
# The full topology (separate worker, read-only fallback API, Rust API) lives in
# docs/DEPLOY_STEPS.md; it is not needed to launch.

services:
  - type: web
    name: campussphere
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build --workspace @campussphere/web
    startCommand: npm run start --workspace @campussphere/web
    healthCheckPath: /api/health/ready
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Fill one of these two. Leaving both blank is safe: setup stays locked.
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: SETUP_TOKEN
        sync: false
