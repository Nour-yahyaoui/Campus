# Full topology blueprint for CampusSphere (web + worker + two optional APIs).
#
# Most people do not need this file: `deployment/render.yaml` deploys the entire
# product as one service, which is the documented quick path. Use this one when
# you want background email/cleanup jobs, the read-only fallback API, or the
# Rust API.
#
# Render only reads `render.yaml` from the repository root automatically. To use
# this file, either copy it over that path or point the Blueprint at it
# explicitly (New → Blueprint → Blueprint Path).
#
# This file is a starting configuration, not evidence that anything has been
# deployed. Replace every `campussphere.example.edu` with your real domain and
# fill in the `sync: false` secrets in the Render dashboard after the first
# sync. See docs/DEPLOY_STEPS.md for the ordered runbook.
#
# Notes that cost people an afternoon:
# - Builds install dev dependencies (`--include=dev`) because `next build` and
#   the worker's `tsx` runner are not production dependencies in the strict
#   sense; without the flag, `NODE_ENV=production` makes `npm ci` skip them.
# - Schema creation is done by the app: open `/api/initialize` once after the
#   first deploy (see docs/DEPLOY_QUICK.md). The CLI (`npm run db:migrate`) does
#   the same thing with the same ledger, so the two never disagree.
# - Image storage is Neon Object Storage (bucket `campus`, S3-compatible). The
#   AWS_* values are per-branch credentials with the storage:read and
#   storage:write scopes; the worker needs them too so it can delete files for
#   abandoned uploads.
# - Migrations are NOT run here. Apply them from your machine against Neon's
#   *direct* (non-pooler) URL before the first deploy; runtime uses the pooled
#   URL.
# - The worker needs a paid instance type on Render. If you are on a free plan
#   for now, delete the worker service and expect no email delivery, reminders
#   or cleanup jobs until one exists.

services:
  # ---------------------------------------------------------------- web app
  - type: web
    name: campussphere-web
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build --workspace @campussphere/web
    startCommand: npm run start --workspace @campussphere/web
    healthCheckPath: /api/health/ready
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      # Optional: without it the app uses Render's own service URL.
      - key: NEXT_PUBLIC_SITE_URL
        value: https://campussphere.example.edu
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ALLOW_DEV_SIGN_IN
        value: "false"
      - key: DB_POOL_MAX
        value: "5"
      - key: EMAIL_TRANSPORT
        value: console
      - key: EMAIL_FROM
        value: CampusSphere <no-reply@campussphere.example.edu>
      - key: STORAGE_BUCKET
        value: campus
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: STORAGE_PUBLIC_BASE_URL
        sync: false

  # --------------------------------------------------------- primary Rust API
  # Optional read-only JSON API. CI compiles, lints, tests it and builds this
  # image on every push. The context is apps/rust-api because that folder is a
  # self-contained Cargo workspace.
  - type: web
    name: campussphere-rust-api
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./apps/rust-api/Dockerfile
    dockerContext: ./apps/rust-api
    healthCheckPath: /health/ready
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        sync: false
      # Optional: without it the app uses Render's own service URL.
      - key: NEXT_PUBLIC_SITE_URL
        value: https://campussphere.example.edu
      - key: RUST_LOG
        value: info

  # ---------------------------------------------------- read-only fallback API
  - type: web
    name: campussphere-fallback-api
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build --workspace @campussphere/api
    startCommand: npm run start --workspace @campussphere/api
    healthCheckPath: /health/ready
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DB_POOL_MAX
        value: "3"
      # Optional: without it the app uses Render's own service URL.
      - key: NEXT_PUBLIC_SITE_URL
        value: https://campussphere.example.edu
      - key: ALLOW_DEV_SIGN_IN
        value: "false"

  # ------------------------------------------------------------------ worker
  - type: worker
    name: campussphere-worker
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci --include=dev
    startCommand: npm run worker
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DB_POOL_MAX
        value: "2"
      - key: EMAIL_TRANSPORT
        value: console
      - key: JOBS_POLL_INTERVAL_MS
        value: "2000"
      - key: ALLOW_DEV_SIGN_IN
        value: "false"
      - key: STORAGE_BUCKET
        value: campus
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: STORAGE_PUBLIC_BASE_URL
        sync: false

